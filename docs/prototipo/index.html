<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>APP FET Pasantías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/*
  Sistema visual APP FET
  - Neutros fríos (slate) + un solo acento cobalto. Verde, ámbar y rojo solo para estados.
  - Radios: controles 8px, paneles 12px, chips y estados en píldora. Sin excepciones.
  - Tipografía: Geist (texto e interfaz), Geist Mono (códigos, cifras de repositorio).
  - Íconos: Tabler Icons (outline), trazo 1.75.
*/
:root{
  --bg:#F5F6F8; --surface:#FCFCFD; --surface-2:#EFF1F4; --line:#E1E4EA; --line-strong:#CDD2DB;
  --ink:#15171C; --ink-2:#474D5B; --ink-3:#646B7B;
  --accent:#2E4BC6; --accent-hover:#253FAA; --accent-ink:#FCFCFD; --accent-soft:#E9EDFB; --accent-text:#2A44B3;
  --ok:#1A7349; --ok-bg:#E2F2E9; --warn:#8F5405; --warn-bg:#FAEFD9; --bad:#AF2A20; --bad-bg:#FAE6E3;
  --gh0:#E7EAEF; --gh1:#C3CEF3; --gh2:#8FA3E8; --gh3:#5670D6; --gh4:#2E4BC6;
  --shadow:0 1px 2px rgb(21 30 60 / .06), 0 4px 16px rgb(21 30 60 / .05);
  --r-ctl:8px; --r-panel:12px;
  --f:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1014; --surface:#15181E; --surface-2:#1C2028; --line:#262B35; --line-strong:#353B47;
    --ink:#ECEEF2; --ink-2:#B4B9C4; --ink-3:#8D93A1;
    --accent:#8FA3F0; --accent-hover:#A7B7F4; --accent-ink:#0E1014; --accent-soft:#1D2542; --accent-text:#A9B8F5;
    --ok:#74CF9E; --ok-bg:#15352A; --warn:#EDB45F; --warn-bg:#3A2B12; --bad:#F2998F; --bad-bg:#3F1E1B;
    --gh0:#1F232C; --gh1:#243462; --gh2:#34509A; --gh3:#5B77D8; --gh4:#8FA3F0;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1014; --surface:#15181E; --surface-2:#1C2028; --line:#262B35; --line-strong:#353B47;
  --ink:#ECEEF2; --ink-2:#B4B9C4; --ink-3:#8D93A1;
  --accent:#8FA3F0; --accent-hover:#A7B7F4; --accent-ink:#0E1014; --accent-soft:#1D2542; --accent-text:#A9B8F5;
  --ok:#74CF9E; --ok-bg:#15352A; --warn:#EDB45F; --warn-bg:#3A2B12; --bad:#F2998F; --bad-bg:#3F1E1B;
  --gh0:#1F232C; --gh1:#243462; --gh2:#34509A; --gh3:#5B77D8; --gh4:#8FA3F0;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(24px,2.4vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--f-mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}
.fine{font-size:13px;color:var(--ink-3)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-ctl);padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap;background:var(--accent);color:var(--accent-ink);transition:background-color .15s, transform .1s}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.sec:hover{background:var(--surface-2)}
.btn.good{background:var(--ok);color:var(--surface)}
.btn.danger{background:transparent;color:var(--bad);border-color:currentColor}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{background:var(--surface-2);color:var(--ink-3);border-color:transparent;cursor:not-allowed;transform:none}
.btn .ic{width:16px;height:16px}

/* ---------- Estados y etiquetas ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--accent-soft);color:var(--accent-text)} .b-neutral{background:var(--surface-2);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px 2px 8px;white-space:nowrap}
.tag .ic{width:14px;height:14px}
.tag.on{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:10px 12px;width:100%}
.input::placeholder{color:var(--ink-3)}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.help{font-size:12.5px;color:var(--ink-3)}
.error{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--bad);background:var(--bad-bg);border-radius:var(--r-ctl);padding:10px 12px}
.error .ic{margin-top:1px}
.input-ic{position:relative}
.input-ic .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.input-ic .input{padding-left:38px}

/* ---------- Login ---------- */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100%}
.l-art{background:var(--accent-soft);padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;gap:40px;position:relative;overflow:hidden}
/* Espacio para foto real del campus: define --login-photo:url(...) en .l-art para mostrarla detrás del contenido */
.l-art::before{content:"";position:absolute;inset:0;background:var(--login-photo,none) center/cover;opacity:.18;pointer-events:none}
.l-art > *{position:relative}
.l-body{margin-block:auto;display:flex;flex-direction:column;gap:32px}
.l-copy{display:flex;flex-direction:column;gap:14px;max-width:36rem}
.l-copy h1{font-size:clamp(28px,2.9vw,40px);letter-spacing:-.03em;line-height:1.05}
.l-copy p{font-size:16px;color:var(--ink-2);max-width:36ch}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);max-width:30rem;overflow:hidden}
.preview-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.preview-row + .preview-row{border-top:1px solid var(--line)}
.preview-cap{font-size:12.5px;color:var(--ink-3);padding:10px 16px;background:var(--surface-2)}
.l-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-inline:16px;background:var(--bg)}
.l-card{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.l-card h2{font-size:22px;letter-spacing:-.02em}
.btn.block{width:100%;padding:12px 16px}
.demo-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:6px;border-top:1px solid var(--line)}
.demo-groups h3{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.demo-groups ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.demo{width:100%;text-align:left;background:transparent;border:0;border-radius:var(--r-ctl);padding:7px 8px;display:flex;flex-direction:column;gap:1px}
.demo:hover{background:var(--surface-2)}
.demo b{font-size:13.5px;font-weight:600}
.demo span{font-size:12px;color:var(--ink-3)}

/* ---------- Estructura de la app ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.mark{width:30px;height:30px;border-radius:var(--r-ctl);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand b{font-weight:700;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--ink-3)}
.me{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-panel)}
.av{width:38px;height:38px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:600;font-size:13.5px;letter-spacing:.02em}
.av.lg{width:44px;height:44px;font-size:15px}
.me b{display:block;font-size:14px;line-height:1.3}
.me span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;background:transparent;border:0;border-radius:var(--r-ctl);padding:9px 10px;text-align:left;color:var(--ink-2);width:100%;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.count{font-family:var(--f-mono);font-size:11.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:500}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-foot button{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:var(--r-ctl);padding:9px 10px;color:var(--ink-2);font-weight:500;width:100%}
.side-foot button:hover{background:var(--surface-2);color:var(--ink)}

.main{min-width:0;padding-block:32px 56px;padding-inline:clamp(16px,3.5vw,40px)}
.main-in{max-width:1120px;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.ph > div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph p{color:var(--ink-2);max-width:62ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.flush{padding:0;gap:0;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.callout{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 20px;align-items:center;background:var(--accent-soft);border-radius:var(--r-panel);padding:14px 18px}
.callout > .ic{width:22px;height:22px;color:var(--accent-text)}
.callout p{color:var(--ink-2)}
.callout p b{color:var(--ink)}
.figs{display:flex;gap:24px}
.fig b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.fig span{font-size:12.5px;color:var(--ink-3)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.search{width:min(320px,100%)}

/* ---------- Filas de vacantes y solicitudes ---------- */
.rowi{display:grid;grid-template-columns:44px minmax(0,1fr) 210px;gap:16px;padding:18px 20px;align-items:start}
.rowi + .rowi{border-top:1px solid var(--line)}
.rowi.dim .rowi-main{opacity:.62}
.logo{width:44px;height:44px;border-radius:var(--r-ctl);background:var(--surface-2);display:grid;place-items:center;font-weight:600;color:var(--ink-2);font-size:14px}
.rowi-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.rowi h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rowi .sub{font-size:13.5px;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0}
.facts div{display:flex;gap:6px;font-size:13px}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;font-weight:500}
.rowi-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.rowi-act .fine{max-width:210px}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-2)}
.empty .ic{width:28px;height:28px;color:var(--ink-3)}

.req{display:flex;flex-wrap:wrap;gap:6px}
.decide{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}
.note-box{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-ctl);padding:9px 12px}
.who{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.who b{display:block;font-size:15px;font-weight:600}
.who span{font-size:13px;color:var(--ink-3)}

/* ---------- Tablas ---------- */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:11px 20px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}

/* ---------- Pasantía ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);overflow:hidden}
.kpi{padding:16px 18px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:13px;color:var(--ink-3)}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:999px}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin:0}
.kv dt{font-size:12.5px;color:var(--ink-3)} .kv dd{margin:2px 0 0;font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.form-grid .wide{grid-column:1 / -1}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.line + .line{border-top:1px solid var(--line)}
.line b{display:block;font-weight:600}
.line span{font-size:13px;color:var(--ink-3)}

/* ---------- Repositorio ---------- */
.repo-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13.5px}
.repo-h .ic{color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:4px;height:44px}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.commits{display:flex;flex-direction:column}
.commit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 0;font-size:13.5px}
.commit + .commit{border-top:1px solid var(--line)}
.commit code{color:var(--ink-3);font-size:12px}
.commit small{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.gh-top{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center}
.gh-top .av{width:52px;height:52px;font-size:17px}
.gh-nums{display:flex;flex-wrap:wrap;gap:28px}
.contrib-wrap{overflow-x:auto}
.contrib{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.contrib i{width:11px;height:11px;border-radius:2px;background:var(--gh0)}
.contrib i[data-l="1"]{background:var(--gh1)} .contrib i[data-l="2"]{background:var(--gh2)} .contrib i[data-l="3"]{background:var(--gh3)} .contrib i[data-l="4"]{background:var(--gh4)}
.langbar{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px}
.langs{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.langs span{display:inline-flex;align-items:center;gap:6px}
.langs i{width:8px;height:8px;border-radius:999px}
.repos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.repo{border:1px solid var(--line);border-radius:var(--r-ctl);padding:14px;display:flex;flex-direction:column;gap:6px}
.repo .nm{font-family:var(--f-mono);font-size:13.5px;color:var(--accent-text)}
.repo p{font-size:13.5px;color:var(--ink-2);flex:1}
.repo .ft{display:flex;gap:16px;font-size:12.5px;color:var(--ink-3);align-items:center}
.repo .ft span{display:inline-flex;gap:5px;align-items:center}
.repo .ft .ic{width:14px;height:14px}
.sub-h{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:10px}

/* ---------- Admin ---------- */
.semgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
.semrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.semrow b{font-weight:600;font-variant-numeric:tabular-nums}
.seg.sm button{padding:5px 11px;font-size:12.5px}

/* ---------- Carga ---------- */
.sk{background:var(--surface-2);border-radius:var(--r-ctl);position:relative;overflow:hidden}
@media (prefers-reduced-motion: no-preference){
  .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .35),transparent);transform:translateX(-100%);animation:sh 1.1s infinite}
  @keyframes sh{to{transform:translateX(100%)}}
  .fade{animation:fade .25s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-ctl);font-size:14px;font-weight:500;z-index:10;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}

/* ---------- Responsive ---------- */
@media (max-width: 960px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .split{grid-template-columns:1fr}

function doLogin(email,pass){
  email=email.trim().toLowerCase();S.email=email;S.err='';
  if(!email||!pass){S.err='Escribe tu correo y tu contraseña.';return render();}
  const k=Object.keys(STU).find(x=>STU[x].email===email);
  if(k){
    const s=STU[k],st=stage(s);
    if(st==='none'){S.err=`Tu cuenta existe, pero en ${s.sem}.º semestre aún no tienes acceso. Pueden ingresar estudiantes de ${semList([...semsOf('apply'),...semsOf('control')].sort((a,b)=>a-b))} semestre.`;return render();}
    if(st==='control'&&!s.pas){S.err=`Estás en ${s.sem}.º semestre, pero todavía no tienes una pasantía asignada. Consulta con la coordinación de prácticas.`;return render();}
    return enter({role:'estudiante',key:k,stage:st},st==='apply'?'vacantes':'pasantia');
  }
  const u=STAFF.find(x=>x.email===email);
  if(u){
    if(u.role==='empresa'&&COMP[u.c].valid!=='ok'){S.err=`${COMP[u.c].name} está pendiente de validación por la FET. Podrás ingresar cuando la administración apruebe el registro.`;return render();}
    return enter({...u},{docente:'aplicaciones',empresa:'postulantes',admin:'config'}[u.role]);
  }
  S.err=email.endsWith('@'+cfg.domain)?'No encontramos una cuenta con este correo institucional.':`Este correo no está registrado. Usa tu correo @${cfg.domain} o el correo con el que tu empresa se registró.`;
  render();
}

        <div class="panel-h"><div><h3>${s.name}</h3><div class="sub">${s.prog}, ${s.sem}.º semestre</div></div>${badge(c,l)}</div>
        <dl class="facts"><div><dt>Vacante</dt><dd>${v.t}</dd></div><div><dt>Empresa</dt><dd>${COMP[v.c].name}</dd></div><div><dt>Enviada</dt><dd>${a.date}</dd></div></dl>
        <div class="req">${modTag(a.via,true)}${badge(semOk?'ok':'bad',`${s.sem}.º semestre ${semOk?'habilitado':'no habilitado'}`)}${a.via==='dir'?badge('neutral',`Promedio ${fmt(s.prom)}, no aplica`):badge(pOk?'ok':'bad',`Promedio ${fmt(s.prom)}`)}${badge(s.hv===100?'ok':'warn',`Hoja de vida ${s.hv} %`)}</div>
        ${a.st==='pendiente'?`<div class="decide"><div class="field"><label for="obs${a.id}">Observación para el estudiante</label><input class="input" id="obs${a.id}" placeholder="Obligatoria si deniegas"></div><button class="btn good" data-dec="aprobada" data-id="${a.id}">${ic('check')}Aprobar</button><button class="btn danger" data-dec="denegada" data-id="${a.id}">${ic('x')}Denegar</button></div>`:(a.note?`<p class="note-box">Tu observación: ${esc(a.note)}</p>`:'')}
      </div></article>`;
  };
  return ph('Aplicaciones','Revisa cada postulación con los requisitos de la FET. Las aprobadas pasan a la empresa.')+`
    <div class="toolbar"><div class="seg" role="group" aria-label="Filtrar aplicaciones">${tabs.map(([t,l])=>`<button data-df="${t}" aria-pressed="${S.dFilter===t}">${l}<span class="n">${cnt(t)}</span></button>`).join('')}</div></div>
    <section class="panel flush">${list.length?list.map(row).join(''):`<div class="empty">${ic('circle-check')}<b>No hay aplicaciones aquí</b><span class="fine">Cuando un estudiante se postule, aparecerá en Pendientes.</span></div>`}</section>`;
}
function vDocCurso(){
  const ks=Object.keys(STU).filter(k=>STU[k].pas);
  return ph('Pasantes en curso','Horas validadas por la empresa y avances por revisar.')+`
    <section class="panel flush"><div class="tbl"><table><thead><tr><th>Estudiante</th><th>Empresa</th><th>Horas</th><th>Asistencias</th><th>Último avance</th><th><span class="fine">Acción</span></th></tr></thead><tbody>
    ${ks.map(k=>{const s=STU[k],p=s.pas,h=hoursDone(k),last=ADV[k][ADV[k].length-1],pend=ATT[k].filter(x=>!x.ok).length,[c,l]=ADV_ST[last.st];
      return `<tr><td><b>${s.name}</b><small>${s.sem}.º semestre</small></td><td>${COMP[p.c].name}<small>${p.rol}</small></td><td class="num">${hf(h)} de ${p.meta}<small>${Math.round(h/p.meta*100)} %</small></td><td>${pend?badge('warn',pend+' por validar'):badge('ok','Al día')}</td><td>${esc(last.t)}<small>${last.f}</small></td><td>${last.st==='Pendiente'?`<button class="btn sm" data-rev="${k}">Marcar revisado</button>`:badge(c,l)}</td></tr>`}).join('')}
    </tbody></table></div></section>`;
}

/* ================= Empresa ================= */
function vEmpPost(){
  const c=S.me.c;
  const mine=APPS.filter(a=>VAC.find(v=>v.id===a.v).c===c&&['aprobada','aceptada','descartada'].includes(a.st)).slice().reverse();
  const row=a=>{
    const s=STU[a.s],v=VAC.find(x=>x.id===a.v),[cl,l]=APP_ST[a.st];
    return `<article class="rowi" style="grid-template-columns:44px minmax(0,1fr)">
      <div class="av lg">${initials(s.name)}</div>
      <div class="rowi-main">
        <div class="panel-h"><div><h3>${s.name}</h3><div class="sub">${s.prog}, ${s.sem}.º semestre, promedio ${fmt(s.prom)}</div></div>${badge(cl,a.st==='aprobada'?'Por decidir':l)}</div>
        <dl class="facts"><div><dt>Vacante</dt><dd>${v.t}</dd></div><div><dt>Aprobada por docente</dt><dd>${a.date}</dd></div><div><dt>Hoja de vida</dt><dd>${s.hv} %</dd></div></dl>
        <div class="tags">${modTag(a.via,true)}</div>
        ${s.gh?`<details><summary class="fine" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center">${ic('brand-github')}Ver GitHub de ${s.name.split(' ')[0]}</summary><div style="margin-top:12px">${ghPanel(s,true)}</div></details>`:''}
        ${a.st==='aprobada'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn good" data-emp="aceptada" data-id="${a.id}">${ic('user-check')}Aceptar</button><button class="btn danger" data-emp="descartada" data-id="${a.id}">Descartar</button></div>`:''}
      </div></article>`;
  };
  return ph('Postulantes',`${COMP[c].name}. Solo ves postulaciones que un docente de la FET ya aprobó.`)+
    `<section class="panel flush">${mine.length?mine.map(row).join(''):`<div class="empty">${ic('inbox')}<b>Aún no hay postulantes aprobados</b><span class="fine">Aparecerán aquí cuando un docente apruebe una postulación a tus vacantes.</span></div>`}</section>`;
}
function vEmpPasantes(){
  const c=S.me.c,ks=Object.keys(STU).filter(k=>STU[k].pas&&STU[k].pas.c===c);
  const nuevos=APPS.filter(a=>a.st==='aceptada'&&VAC.find(v=>v.id===a.v).c===c);
  return ph('Mis pasantes','Valida asistencias y revisa el repositorio en el que trabaja cada pasante.')+
    ks.map(k=>{const s=STU[k],p=s.pas,h=hoursDone(k),pend=ATT[k].filter(x=>!x.ok);
      return `<section class="panel">
        <div class="who"><div class="av lg">${initials(s.name)}</div><div><b>${s.name}</b><span>${p.rol}, ${s.sem}.º semestre</span></div>${badge('ok','En pasantía')}</div>
        <div class="split">
          <div style="display:flex;flex-direction:column;gap:14px">
            <div><div class="sub-h">${hf(h)} de ${p.meta} horas validadas</div><div class="meter"><span style="width:${Math.round(h/p.meta*100)}%"></span></div></div>
            <div><div class="sub-h">Asistencias por validar</div>
            ${pend.length?`<div class="lines">${pend.map(r=>`<div class="line"><div><b>${r.d}, ${r.i} a ${r.o}</b><span>${esc(r.a)}</span></div></div>`).join('')}</div><button class="btn good" style="margin-top:8px" data-valid="${k}">${ic('check')}Validar ${pend.length}</button>`:'<p class="fine">No hay registros pendientes.</p>'}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px"><div class="sub-h" style="margin:0">Repositorio en el que trabaja</div>${repoBox(k)}</div>
        </div></section>`;}).join('')+
    (nuevos.length?`<section class="panel"><h2>Por iniciar</h2><div class="lines">${nuevos.map(a=>{const s=STU[a.s];return `<div class="line"><div><b>${s.name}</b><span>${VAC.find(v=>v.id===a.v).t}. Inicia al pasar a ${s.sem+1}.º semestre.</span></div>${modTag(a.via)}</div>`}).join('')}</div></section>`:'')+
    (!ks.length&&!nuevos.length?`<section class="panel"><div class="empty">${ic('users')}<b>No tienes pasantes activos</b></div></section>`:'');
}
function vEmpVac(){
  const c=S.me.c;
  return ph('Mis vacantes',`Modalidades registradas ante la FET: ${COMP[c].int.map(x=>MOD[x][0].toLowerCase()).join(' y ')}.`,`<button class="btn">${ic('briefcase')}Publicar vacante</button>`)+`
    <section class="panel flush"><div class="tbl"><table><thead><tr><th>Vacante</th><th>Acepta</th><th>Postulaciones</th><th>Publicada</th></tr></thead><tbody>
    ${VAC.filter(v=>v.c===c).map(v=>{const n=APPS.filter(a=>a.v===v.id);return `<tr><td><b>${v.t}</b><small>${v.city}, ${v.dur}</small></td><td><div class="tags">${v.acc.map(x=>modTag(x)).join('')}</div></td><td class="num">${n.filter(a=>a.st!=='pendiente'&&a.st!=='denegada').length} aprobadas<small>${n.filter(a=>a.st==='pendiente').length} en revisión docente</small></td><td class="num">${v.dias}</td></tr>`}).join('')}
    </tbody></table></div></section>`;
}

/* ================= Administrador ================= */
function vAdmConfig(){
  const opts=[['none','Sin acceso'],['apply','Aplica'],['control','Pasantía']];
  return ph('Configuración','Reglas de acceso y postulación. Los cambios aplican al guardar.','<button class="btn" id="saveCfg">Guardar cambios</button>')+`
    <section class="panel"><div><h2>Acceso por semestre</h2><p class="fine" style="margin-top:4px">Aplica: ve vacantes y se postula. Pasantía: registra asistencias y avances.</p></div>
      <div class="semgrid">${Array.from({length:10},(_,i)=>{const n=i+1;return `<div class="semrow"><b>${n}.º semestre</b><div class="seg sm" role="radiogroup" aria-label="${n}.º semestre">${opts.map(([o,l])=>`<button type="button" data-cs="${n}" data-val="${o}" aria-pressed="${(S.draft||cfg.sem)[n]===o}">${l}</button>`).join('')}</div></div>`}).join('')}</div>
    </section>
    <section class="panel"><h2>Reglas de postulación</h2>
      <div class="form-grid">
        <div class="field"><label for="cProm">Promedio mínimo para pasantía</label><input class="input" id="cProm" type="number" step="0.1" min="0" max="5" value="${cfg.prom}"><span class="help">Debajo de este valor solo se aplica por contratación directa.</span></div>
        <div class="field"><label for="cDom">Dominio del correo institucional</label><input class="input" id="cDom" value="${esc(cfg.domain)}"><span class="help">Sin la arroba.</span></div>
        <div class="field"><label for="cHv">Hoja de vida para postularse</label><select class="input" id="cHv"><option>El docente decide</option><option>Completa al 100 %</option></select><span class="help">Requisito mínimo antes de aplicar.</span></div>
      </div></section>`;
}
function vAdmEmp(){
  return ph('Empresas','Solo las empresas validadas pueden ingresar y publicar vacantes.')+`
    <section class="panel flush"><div class="tbl"><table><thead><tr><th>Empresa</th><th>NIT</th><th>Interés</th><th>Estado</th><th><span class="fine">Acción</span></th></tr></thead><tbody>
    ${Object.entries(COMP).map(([k,c])=>`<tr><td><b>${c.name}</b><small>${c.city}</small></td><td class="num mono">${c.nit}</td><td><div class="tags">${c.int.map(x=>modTag(x)).join('')}</div></td><td>${c.valid==='ok'?badge('ok','Validada'):c.valid==='no'?badge('bad','Rechazada'):badge('warn','Pendiente')}</td><td>${c.valid==='pend'?`<div style="display:flex;gap:6px"><button class="btn good sm" data-comp="ok" data-k="${k}">Validar</button><button class="btn danger sm" data-comp="no" data-k="${k}">Rechazar</button></div>`:''}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function vAdmUsers(){
  const acc={none:badge('bad','Sin acceso'),apply:badge('info','Aplica'),control:badge('ok','Pasantía')};
  const rows=[...Object.values(STU).map(s=>[s.name,s.email,'Estudiante',`${s.sem}.º`,acc[stage(s)]]),...STAFF.map(u=>[u.name,u.email,{docente:'Docente',empresa:'Empresa',admin:'Administrador'}[u.role],'No aplica',u.role==='empresa'&&COMP[u.c].valid!=='ok'?badge('warn','Sin validar'):badge('ok','Activo')])];
  return ph('Usuarios','Quién puede ingresar y con qué rol.')+`
    <section class="kpis">
      <div class="kpi"><b>${Object.values(STU).filter(s=>stage(s)==='apply').length}</b><span>Estudiantes que aplican</span></div>
      <div class="kpi"><b>${Object.values(STU).filter(s=>stage(s)==='control').length}</b><span>Estudiantes en pasantía</span></div>
      <div class="kpi"><b>${STAFF.filter(u=>u.role==='docente').length}</b><span>Docentes</span></div>
      <div class="kpi"><b>${Object.values(COMP).filter(c=>c.valid==='ok').length}</b><span>Empresas validadas</span></div>
    </section>
    <section class="panel flush"><div class="tbl"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Semestre</th><th>Acceso</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td class="mono">${r[1]}</td><td>${r[2]}</td><td class="num">${r[3]}</td><td>${r[4]}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

/* ================= Render y eventos ================= */
const VIEWS={vacantes:vVacantes,postulaciones:vPostulaciones,hv:vHV,semestre:vSemestre,viabilidad:vViabilidad,pasantia:vPasantia,asistencias:vAsistencias,avances:vAvances,aplicaciones:vDocApps,encurso:vDocCurso,postulantes:vEmpPost,pasantes:vEmpPasantes,misvacantes:vEmpVac,config:vAdmConfig,empresas:vAdmEmp,usuarios:vAdmUsers};
function fieldErr(input,help,msg){input.setAttribute('aria-invalid','true');input.style.borderColor='var(--bad)';help.textContent=msg;help.style.color='var(--bad)';input.focus();}
function render(){
  if(!S.me) return viewLogin();
  shell(S.loading?skeleton():(VIEWS[S.view]||(()=>''))());
  if(S.loading) return;
  const q=$('#q');
  if(q) q.addEventListener('input',ev=>{S.q=ev.target.value;const pos=ev.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);});
  const af=$('#attForm');
  if(af) af.addEventListener('submit',ev=>{ev.preventDefault();const a=$('#aAct').value.trim();if(!a) return fieldErr($('#aAct'),$('#aHelp'),'Escribe la actividad realizada para poder registrar la asistencia.');if(hrs($('#aIn').value,$('#aOut').value)<=0) return fieldErr($('#aOut'),$('#aHelp'),'La hora de salida debe ser posterior a la de entrada.');ATT[S.me.key].push({d:'Mar 29 sep',i:$('#aIn').value,o:$('#aOut').value,a,ok:false});render();toast('Asistencia registrada. La empresa debe validarla.');});
  const vf=$('#advForm');
  if(vf) vf.addEventListener('submit',ev=>{ev.preventDefault();const t=$('#vTit').value.trim();if(!t) return fieldErr($('#vTit'),$('#vHelp'),'Escribe un título para la entrega.');ADV[S.me.key].push({tipo:$('#vTipo').value,t,f:'29 sep',st:'Pendiente'});render();toast('Avance enviado a revisión.');});
}
document.addEventListener('click',ev=>{
  const t=ev.target;
  const demo=t.closest('[data-demo]'); if(demo){S.email=demo.dataset.demo;S.err='';render();$('#loginForm button[type=submit]').focus();return;}
  if(t.closest('#logout')){Object.assign(S,{me:null,view:null,err:'',filter:'todas',q:'',draft:null});render();return;}
  const nav=t.closest('[data-view]'); if(nav){S.view=nav.dataset.view;S.draft=null;render();window.scrollTo({top:0});return;}
  const f=t.closest('[data-f]'); if(f){S.filter=f.dataset.f;render();return;}
  const df=t.closest('[data-df]'); if(df){S.dFilter=df.dataset.df;render();return;}
  const ap=t.closest('[data-apply]'); if(ap){APPS.push({id:nextApp++,s:S.me.key,v:+ap.dataset.apply,via:ap.dataset.via,st:'pendiente',note:'',date:'29 sep'});render();toast('Postulación enviada. Tu docente la revisará.');return;}
  const dec=t.closest('[data-dec]'); if(dec){const a=APPS.find(x=>x.id===+dec.dataset.id),inp=$('#obs'+a.id),obs=inp.value.trim();
    if(dec.dataset.dec==='denegada'&&!obs){inp.setAttribute('aria-invalid','true');inp.style.borderColor='var(--bad)';inp.placeholder='Escribe el motivo para denegar';inp.focus();return;}
    a.st=dec.dataset.dec;a.note=obs;render();toast(a.st==='aprobada'?'Aprobada. Ahora la ve la empresa.':'Denegada. El estudiante verá tu observación.');return;}
  const emp=t.closest('[data-emp]'); if(emp){const a=APPS.find(x=>x.id===+emp.dataset.id);a.st=emp.dataset.emp;render();toast(a.st==='aceptada'?'Estudiante aceptado.':'Postulación descartada.');return;}
  const va=t.closest('[data-valid]'); if(va){ATT[va.dataset.valid].forEach(x=>x.ok=true);render();toast('Asistencias validadas.');return;}
  const rv=t.closest('[data-rev]'); if(rv){ADV[rv.dataset.rev].forEach(a=>{if(a.st==='Pendiente')a.st='Revisado'});render();toast('Avance marcado como revisado.');return;}
  const cp=t.closest('[data-comp]'); if(cp){COMP[cp.dataset.k].valid=cp.dataset.comp;render();toast(cp.dataset.comp==='ok'?'Empresa validada. Ya puede ingresar.':'Registro rechazado.');return;}
  const cs=t.closest('[data-cs]'); if(cs){S.draft=S.draft||{...cfg.sem};S.draft[cs.dataset.cs]=cs.dataset.val;const p=$('#cProm').value,d=$('#cDom').value;render();$('#cProm').value=p;$('#cDom').value=d;return;}
  if(t.closest('#saveCfg')){
    if(S.draft){cfg.sem={...S.draft};S.draft=null;}
    const p=parseFloat($('#cProm').value);if(!isNaN(p)&&p>=0&&p<=5)cfg.prom=p;
    const d=$('#cDom').value.trim().replace(/^@/,'');if(d)cfg.domain=d;
    render();toast('Configuración guardada.');return;}
});
render();
</script>

</body></html>
